name: Build and release

# Push a tag like v0.1.0 to build both apps and publish them on the Releases page.
# Run it by hand (Actions → Build and release → Run workflow) to build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} (macOS)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: github-agent
            name: GitHub Agent
          - app: google-agent
            name: Google Agent
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.app }}/src-tauri

      - run: npm ci

      # beforeBuildCommand builds llama-server, the Next.js UI and the Python backend sidecar first.
      # No OAuth client is built in: on first run each app asks for the user's own.
      - name: Build app
        run: npx tauri build --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-macos
          path: ${{ matrix.app }}/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.dmg
          generate_release_notes: true
