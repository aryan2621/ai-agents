name: Build and release

# Every push to main builds both apps for macOS and Windows (installers under the run's Artifacts).
# Push a tag like v0.1.0 to also publish them on the Releases page.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        app: [github-agent, google-agent]
        os: [macos-15, windows-latest]
        include:
          - app: github-agent
            name: GitHub Agent
          - app: google-agent
            name: Google Agent
          - os: macos-15
            os_name: macOS
            bundles: app,dmg
          # Windows is a beta: built and packaged in CI, not yet tried on real PCs.
          - os: windows-latest
            os_name: Windows
            bundles: nsis
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.app }}/src-tauri

      - run: npm ci

      # beforeBuildCommand builds llama-server, the Next.js UI and the Python backend sidecar first.
      # No OAuth client is built in: on first run each app asks for the user's own.
      - name: Build app
        id: build
        continue-on-error: ${{ runner.os == 'macOS' }}
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # hdiutil on GitHub's macOS runners sometimes fails with "Resource busy"; one retry clears it.
      - name: Build app (retry)
        if: steps.build.outcome == 'failure' && runner.os == 'macOS'
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ runner.os }}
          path: |
            ${{ matrix.app }}/src-tauri/target/release/bundle/dmg/*.dmg
            ${{ matrix.app }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
          generate_release_notes: true
